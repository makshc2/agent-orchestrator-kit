version: 1
kit_version: "{{KIT_VERSION}}"

project:
  name: "{{PROJECT_NAME}}"
  agent_language: "{{LANG}}"

package_manager: npm

pipeline:
  require_spec_review: true
  require_design_brief: false
  max_active_changes: 1
  archive_after_merge: true
  task_contract: warn

roles:
  explorer:
    command: /opsx:explore
    mode: read-only
    model_hint: fast
  design_intake:
    command: /opsx:design
    mode: brief-only
    model_hint: strong
  architect:
    command: /opsx:propose
    mode: specs-only
    model_hint: strong
  spec_reviewer:
    command: /opsx:review
    mode: read-only
    model_hint: medium
  implementer:
    command: /opsx:apply
    mode: code
    model_hint: strong
  verifier:
    type: ci
    gates:
      - openspec-validate-strict
      - lint
      - build

handoff:
  explore_to_propose: decision_brief
  propose_to_review: validate_strict
  review_to_apply: explicit_approve
  apply_to_verify: all_tasks_checked
  restore_on_start: true
  persist_on_exit: true
  emit_next_session_prompt: true
  prompt_self_contained: true
  spawn_handoff_subagent: false

memory:
  enabled: true
  file: .cursor/memory.json
  launcher: scripts/memory-mcp-launcher.cjs

mcp:
  baseline:
    - memory
  optional:
    - figma
    - github
    - browser

figma:
  env_file: .agents/figma.local.env
  token_key: FIGMA_ACCESS_TOKEN
  mcp_launcher: scripts/figma-mcp-launcher.cjs

verifier:
  lint_command: "npm run lint"
  build_command: "npm run build"
  test_command: ""

# Amp/Cursor often lack global bins — agents must use npx/npm (see .agents/rules/cli-via-npm.mdc)
cli:
  status: npx agent-orchestrator-kit status
  gate_check: npx agent-orchestrator-kit gate-check
  handoff: npx agent-orchestrator-kit handoff <name>
  handoff_restore: npx agent-orchestrator-kit handoff --restore
  memory_setup: npx agent-orchestrator-kit memory-setup
  openspec_list: npx openspec list
  openspec_validate_change: npx openspec validate <name> --strict --type change
  openspec_validate_all: npx openspec validate --all --strict
  openspec_status: npx openspec status --change <name> --json
